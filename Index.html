<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hat Switch</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column. Top bar with language and mode controls, a segmented progress strip, then one working card at a time. */
:root {
  --bg: #F1F5FA; --surface: #FFFFFF; --ink: #14213D; --muted: #55637D; --line: #D5DDE9;
  --mgmt: #0B6665; --mgmt-soft: #DCF0EF;
  --lead: #1A5FBF; --lead-soft: #E0EBFA;
  --both: #8A5A0C; --both-soft: #F6EAD0;
  --good: #1B7A44; --good-soft: #DDF3E5; --bad: #B83225; --bad-soft: #FBE3DF;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1525; --surface: #162036; --ink: #E8EEF9; --muted: #9AA8C3; --line: #2A3652;
    --mgmt: #55D6C9; --mgmt-soft: #143A3E; --lead: #78AEFF; --lead-soft: #172F59;
    --both: #F2BA60; --both-soft: #3D2F14; --good: #5BE08E; --good-soft: #15381F; --bad: #FF8B7E; --bad-soft: #43201C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1525; --surface: #162036; --ink: #E8EEF9; --muted: #9AA8C3; --line: #2A3652;
  --mgmt: #55D6C9; --mgmt-soft: #143A3E; --lead: #78AEFF; --lead-soft: #172F59;
  --both: #F2BA60; --both-soft: #3D2F14; --good: #5BE08E; --good-soft: #15381F; --bad: #FF8B7E; --bad-soft: #43201C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app[lang="ar"] { font-family: var(--f-ar); }
#app[lang="ar"] h1, #app[lang="ar"] h2, #app[lang="ar"] .big { font-family: var(--f-ar); letter-spacing: 0; }
.wrap { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lead); outline-offset: 2px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1rem; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: .85rem; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--lead); }
.progress i.now { background: var(--ink); }
.progress i.sep { flex: 0 0 10px; background: transparent; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 18px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
#app[lang="ar"] .eyebrow { letter-spacing: 0; text-transform: none; font-size: .88rem; }
.big { font-family: var(--f-display); font-size: clamp(1.35rem, 3.6vw, 1.85rem); line-height: 1.3; font-weight: 500; text-wrap: balance; }
.muted { color: var(--muted); }

.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choice { display: grid; justify-items: center; gap: 4px; padding: 14px 10px; border-radius: 12px; border: 2px solid transparent; font-weight: 600; text-align: center; min-width: 0; }
.choice svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.choice small { font-weight: 500; opacity: .75; font-size: .75rem; }
.choice.M { background: var(--mgmt-soft); color: var(--mgmt); }
.choice.L { background: var(--lead-soft); color: var(--lead); }
.choice.B { background: var(--both-soft); color: var(--both); }
.choice:hover:not(:disabled) { border-color: currentColor; }
.choice:disabled { cursor: default; opacity: .45; }
.choice.picked { opacity: 1; border-color: currentColor; }
.choice.answer { opacity: 1; border-color: currentColor; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }

.fb { border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb.info { background: var(--lead-soft); }
.verdict { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--good); }
.fb.no .verdict { color: var(--bad); }
.fb.info .verdict { color: var(--ink); }
.tag { display: inline-block; justify-self: start; font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }

.btn { border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; background: var(--ink); color: var(--bg); justify-self: start; }
.btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hint { font-size: .85rem; color: var(--muted); }

.packs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pack { text-align: start; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 2px; min-width: 0; }
.pack b { font-family: var(--f-display); font-size: 1.02rem; }
#app[lang="ar"] .pack b { font-family: var(--f-ar); }
.pack span { font-size: .85rem; color: var(--muted); }
.pack[aria-pressed="true"] { border-color: var(--lead); background: var(--lead-soft); }
.pack:last-child:nth-child(odd) { grid-column: 1 / -1; }

.acts { display: grid; gap: 10px; }
.act { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.act p { margin: 0; font-weight: 500; }
.act .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act .choice { padding: 8px; grid-auto-flow: column; justify-content: center; gap: 8px; font-size: .92rem; }
.act .choice svg { width: 20px; height: 20px; }
.act.ok { border-color: var(--good); }
.act.no { border-color: var(--bad); }
.act .res { font-size: .9rem; display: grid; gap: 4px; }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .n { font-family: var(--f-display); font-size: 3rem; font-weight: 700; line-height: 1; }
.recap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.col { border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.col.M { background: var(--mgmt-soft); } .col.L { background: var(--lead-soft); }
.col h2 { font-size: 1.15rem; }
.col.M h2 { color: var(--mgmt); } .col.L h2 { color: var(--lead); }
.col ul { margin: 0; padding-inline-start: 1.1rem; }
.col .out { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.qs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.qs li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.qs b { font-family: var(--f-display); color: var(--lead); }
.miss { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.miss li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.src { font-size: .8rem; color: var(--muted); }

@media (max-width: 560px) {
  .choices { grid-template-columns: 1fr; }
  .choice { grid-auto-flow: column; justify-content: start; padding: 12px 14px; }
  .choice small { margin-inline-start: auto; }
  .recap, .packs { grid-template-columns: 1fr; }
  .card { padding: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .fb { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

};

const PACKS = [
  { name: { en: 'Sales and real estate', ar: 'المبيعات والعقارات' }, desc: { en: 'Agents, leads, pipelines', ar: 'مسوّقون، عملاء محتملون، صفقات' }, cards: [
    { a: 'M', k: 'plan', t: { en: 'Sets each agent’s monthly target and divides the new leads between them.', ar: 'يحدد الهدف الشهري لكل مسوّق ويوزع العملاء المحتملين الجدد بينهم.' }, why: { en: 'Setting targets and allocating resources is planning and budgeting.', ar: 'وضع الأهداف وتخصيص الموارد هو التخطيط والميزانية.' } },

    { a: 'M', k: 'ctrl', t: { en: 'Monitors average handling time and coaches the agents who run over.', ar: 'يتابع متوسط زمن المكالمة ويوجّه الموظفين الذين يتجاوزونه.' }, why: { en: 'Measuring against a standard and correcting is controlling and problem solving.', ar: 'القياس مقابل معيار والتصحيح هو الرقابة وحل المشكلات.' } },
    { a: 'L', k: 'motiv', t: { en: 'Talks to an agent who is worn out after a hard month and asks what would make the job better.', ar: 'يتحدث مع موظف منهك بعد شهر صعب ويسأله ما الذي يجعل العمل أفضل.' }, why: { en: 'Meeting people’s needs to keep them going is motivating and inspiring.', ar: 'تلبية احتياجات الناس ليواصلوا هو التحفيز والإلهام.' } },
    { a: 'B', k: 'both', t: { en: 'Introduces an AI chatbot: plans the rollout dates and calms the agents’ fears about their jobs.', ar: 'يُدخل روبوت دردشة بالذكاء الاصطناعي: يخطط مواعيد التطبيق ويهدئ مخاوف الموظفين على وظائفهم.' }, why: { en: 'The rollout plan is management. Addressing the fear and explaining the new role is leadership.', ar: 'خطة التطبيق إدارة، ومعالجة الخوف وشرح الدور الجديد قيادة.' } }
  ]},
  { name: { en: 'Any business', ar: 'أي شركة' }, desc: { en: 'Budgets, projects, strategy', ar: 'ميزانيات، مشروعات، استراتيجية' }, cards: [
    { a: 'M', k: 'plan', t: { en: 'Allocates next year’s budget across the departments.', ar: 'يوزع ميزانية العام القادم على الأقسام.' }, why: { en: 'Allocating resources against plans is planning and budgeting.', ar: 'تخصيص الموارد وفق الخطط هو التخطيط والميزانية.' } },
    { a: 'L', k: 'innov', t: { en: 'Challenges the team to rethink how the company reaches its customers.', ar: 'يتحدى الفريق ليعيد التفكير في طريقة وصول الشركة إلى عملائها.' }, why: { en: 'Creativity and fostering innovation sit on the leadership side of the slide.', ar: 'الإبداع وتعزيز الابتكار في جانب القيادة من الشريحة.' } },
    { a: 'M', k: 'ctrl', t: { en: 'Tracks project milestones against the deadline and adjusts the plan.', ar: 'يتابع مراحل المشروع مقابل الموعد النهائي ويعدّل الخطة.' }, why: { en: 'Monitoring against the plan and adjusting is controlling and problem solving.', ar: 'المتابعة مقابل الخطة والتعديل هو الرقابة وحل المشكلات.' } },
    { a: 'L', k: 'align', t: { en: 'Builds a coalition among department heads behind a new company strategy.', ar: 'يبني تحالفًا بين رؤساء الأقسام خلف استراتيجية جديدة للشركة.' }, why: { en: 'Getting people to commit to a shared direction is aligning people.', ar: 'جعل الناس يلتزمون باتجاه مشترك هو مواءمة الناس.' } },
    { a: 'B', k: 'both', t: { en: 'Reorganises the team structure, then explains the reason so people stay committed.', ar: 'يعيد تنظيم هيكل الفريق، ثم يشرح السبب حتى يبقى الناس ملتزمين.' }, why: { en: 'The new structure is management. Explaining why, so people stay with you, is leadership.', ar: 'الهيكل الجديد إدارة، وشرح السبب ليبقى الناس معك قيادة.' } }
  ]},
  { name: { en: 'Decisions and people', ar: 'القرارات والتعامل مع الناس' }, desc: { en: 'Budgets, tough conversations, problem solving', ar: 'ميزانيات، محادثات صعبة، حل مشكلات' }, cards: [
    { a: 'M', k: 'plan', t: { en: 'Two departments need the same budget line this quarter. Compares each business case against the plan and decides the split.', ar: 'قسمان يحتاجان بند الميزانية نفسه هذا الربع. يقارن حالة كل قسم بالخطة ويقرر التقسيم.' }, why: { en: 'Allocating limited resources against plans is planning and budgeting.', ar: 'تخصيص موارد محدودة وفق الخطط هو التخطيط والميزانية.' } },
    { a: 'L', k: 'motiv', t: { en: 'After a failed product launch, gathers the team to agree what the company will do differently instead of looking for someone to blame.', ar: 'بعد إطلاق منتج فاشل، يجمع الفريق ليتفقوا على ما ستفعله الشركة بشكل مختلف بدل البحث عمّن يُلام.' }, why: { en: 'Turning a failure into shared learning keeps people committed: motivating and inspiring.', ar: 'تحويل الفشل إلى تعلم مشترك يُبقي الناس ملتزمين: التحفيز والإلهام.' } },
    { a: 'B', k: 'both', t: { en: 'Meets an under-performing employee, listens to what is behind it, and agrees a 30-day plan with clear measures.', ar: 'يلتقي بموظف أداؤه ضعيف، ويستمع إلى ما وراء ذلك، ثم يتفقان على خطة لثلاثين يومًا بمقاييس واضحة.' }, why: { en: 'Listening and re-engaging the person is leadership. The plan and the measures are management.', ar: 'الاستماع وإعادة إشراك الشخص قيادة، والخطة والمقاييس إدارة.' } },
    { a: 'M', k: 'ctrl', t: { en: 'A key supplier misses a delivery. Re-plans the production schedule and moves the orders to a backup supplier.', ar: 'مورّد رئيسي يتأخر في التسليم. يعيد جدولة الإنتاج وينقل الطلبات إلى مورّد بديل.' }, why: { en: 'Fixing a deviation from the plan with a practical workaround is controlling and problem solving.', ar: 'تصحيح انحراف عن الخطة بحل عملي هو الرقابة وحل المشكلات.' } },
    { a: 'L', k: 'dir', t: { en: 'Decides to leave a profitable but declining product line, and explains the long-term logic to everyone.', ar: 'يقرر الخروج من خط منتجات مربح لكنه يتراجع، ويشرح المنطق بعيد المدى للجميع.' }, why: { en: 'A long-term bet and the case for it is setting a direction.', ar: 'رهان بعيد المدى والحجة له هو تحديد الاتجاه.' } }
  ]}
];

const FIN = [
  { a: 'M', k: 'plan', t: { en: 'Set the training schedule and the milestones.', ar: 'وضع جدول التدريب والمراحل.' } },
  { a: 'L', k: 'dir', t: { en: 'Explain why the system matters and where the team is heading.', ar: 'شرح أهمية النظام والاتجاه الذي يسير إليه الفريق.' } },
  { a: 'M', k: 'org', t: { en: 'Assign trainers and arrange cover for people who are in training.', ar: 'تكليف المدربين وتدبير بدلاء لمن هم في التدريب.' } },
  { a: 'L', k: 'align', t: { en: 'Listen to the sceptical senior staff and bring them on board.', ar: 'الاستماع إلى كبار الموظفين المتشككين وكسبهم.' } },
  { a: 'M', k: 'ctrl', t: { en: 'Track adoption every week and fix the problems that appear.', ar: 'متابعة مدى الاستخدام أسبوعيًا وحل المشكلات التي تظهر.' } },
  { a: 'L', k: 'motiv', t: { en: 'Recognise the early adopters and keep spirits up when it gets hard.', ar: 'تقدير الأوائل في الاستخدام ورفع المعنويات عندما يصعب الأمر.' } }
];

const S = { lang: 'en', screen: 'start', pack: 4, i: 0, picked: null, score: 0, miss: [], fin: {} };
const app = document.getElementById('app');
const T = o => o[S.lang];
const U_ = k => U[k][S.lang];
const full = () => S.screen === 'fin' || S.screen === 'results' ? 11 : 5 + S.i;

function bar() {
  return `<div class="bar">
    <div class="brand">${IC.B}<span>${U_('title')}</span></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Language">
        <button data-act="lang" data-v="en" aria-pressed="${S.lang === 'en'}">EN</button>
        <button data-act="lang" data-v="ar" aria-pressed="${S.lang === 'ar'}">عربي</button>
      </div>
    </div></div>`;
}
function progress() {
  let h = '<div class="progress" aria-hidden="true">';
  const cur = S.screen === 'play' ? S.i : S.screen === 'fin' ? 5 : 11;
  for (let n = 0; n < 5; n++) h += `<i class="${n < cur ? 'done' : n === cur && S.screen === 'play' ? 'now' : ''}"></i>`;
  h += '<i class="sep"></i>';
  for (let n = 0; n < 6; n++) {
    const done = S.screen === 'results' || (S.screen === 'fin' && S.fin[n] !== undefined);
    h += `<i class="${done ? 'done' : S.screen === 'fin' && n === Object.keys(S.fin).length ? 'now' : ''}"></i>`;
  }
  return h + '</div>';
}
function choiceBtn(k, disabled, cls, hint) {
  return `<button class="choice ${k} ${cls || ''}" data-act="pick" data-v="${k}" ${disabled ? 'disabled' : ''}>${IC[k]}<span>${U_(k)}</span>${hint && S.lang === 'en' ? `<small>${k}</small>` : ''}</button>`;
}

function start() {
  const packs = PACKS.map((p, n) => `<button class="pack" data-act="pack" data-v="${n}" aria-pressed="${S.pack === n}"><b>${T(p.name)}</b><span>${T(p.desc)}</span></button>`).join('');
  return `<div class="card">
    <div><div class="eyebrow">Leadership VS Management</div></div>
    <h1 class="big">${U_('sub')}</h1>
    <div><div class="eyebrow" style="margin-bottom:8px">${U_('pickPack')}</div><div class="packs">${packs}</div></div>
    <button class="btn" data-act="start">${U_('start')}</button>
  </div>`;
}

function play() {
  const c = PACKS[S.pack].cards[S.i];
  const answered = S.picked !== null;
  let fb = '';
  if (answered) {
    const ok = S.picked === c.a;
    const head = ok ? U_('right') : `${U_('wrong')} ${U_('answerIs')}: ${U_(c.a)}`;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}" aria-live="polite"><div class="verdict">${head}</div><div>${T(c.why)}</div><span class="tag">${T(LK[c.k])}</span></div>`;
  }
  const btns = ['M', 'L', 'B'].map(k => choiceBtn(k, answered, answered ? (k === c.a ? 'answer' : k === S.picked ? 'picked' : '') : '', true)).join('');
  const last = S.i === 4;
  const ctl = answered
    ? `<button class="btn" data-act="next">${last ? U_('toFinale') : U_('next')}</button>`
    : (S.lang === 'en' ? `<span class="hint">Keys: M, L, B</span>` : '');
  return `<div class="card">
    <div class="eyebrow">${U_('moment')} ${S.i + 1} / 5</div>
    <h2 class="big">${T(c.t)}</h2>
    <div class="choices" role="group">${btns}</div>
    ${fb}
    <div class="row">${ctl}</div>
  </div>`;
}

function fin() {
  const n = Object.keys(S.fin).length;
  const rows = FIN.map((f, x) => {
    const ch = S.fin[x];
    let res = '', cls = '';
    if (ch !== undefined) {
      const ok = ch === f.a;
      cls = ok ? 'ok' : 'no';
      res = `<div class="res"><b style="color:var(${f.a === 'M' ? '--mgmt' : '--lead'})">${f.a === 'M' ? U_('hatM') : U_('hatL')}</b><span class="tag">${T(LK[f.k])}</span>${!ok ? `<span>${U_('wrong')}</span>` : ''}</div>`;
    }
    const two = `<div class="two">${['M', 'L'].map(k => `<button class="choice ${k} ${ch === k ? 'picked' : ''}" data-act="fin" data-i="${x}" data-v="${k}" ${ch !== undefined ? 'disabled' : ''}>${IC[k]}<span>${k === 'M' ? U_('hatM') : U_('hatL')}</span></button>`).join('')}</div>`;
    return `<div class="act ${cls}"><p>${T(f.t)}</p>${two}${res}</div>`;
  }).join('');
  const ctl = n === 6 ? `<button class="btn" data-act="results">${U_('toResults')}</button>` : `<span class="hint">${n} / 6</span>`;
  return `<div class="card">
    <div class="eyebrow">${U_('finale')}</div>
    <h2 class="big">${U_('finTitle')}</h2>
    <p style="margin:0" class="muted">${U_('finText')}</p>
    <div class="acts">${rows}</div>
    <div class="row">${ctl}</div>
  </div>`;
}

function results() {
  const finScore = FIN.reduce((a, f, x) => a + (S.fin[x] === f.a ? 1 : 0), 0);
  const total = S.score + finScore;
  const msg = total >= 10 ? U_('msgHi') : total >= 7 ? U_('msgMid') : U_('msgLo');
  const scoreBlock = `<div class="card"><div class="score"><span class="n">${total}</span><span class="muted">${U_('of')} 11</span></div><p style="margin:0">${msg}</p></div>`;
  const missed = S.miss.length ? `<div class="card"><div class="eyebrow">${U_('missed')}</div><ul class="miss">${S.miss.map(m => `<li><span>${T(m.t)}</span><b>${U_(m.a)}</b></li>`).join('')}</ul></div>` : '';
  const L = (k) => U[k][S.lang].map(x => `<li>${x}</li>`).join('');
  return `${scoreBlock}
  <div class="card"><div class="eyebrow">${U_('recapTitle')}</div>
    <div class="recap">
      <div class="col M"><h2>${U_('M')}</h2><div class="muted">${U_('mgmtSub')}</div><ul>${L('mgmtList')}</ul><div class="out">${U_('mgmtOut')}</div></div>
      <div class="col L"><h2>${U_('L')}</h2><div class="muted">${U_('leadSub')}</div><ul>${L('leadList')}</ul><div class="out">${U_('leadOut')}</div></div>
    </div></div>
  ${missed}
  <div class="row"><button class="btn" data-act="again">${U_('again')}</button><button class="btn alt" data-act="redo">${U_('redo')}</button></div>
  <p class="src">${U_('src')}</p>`;
}

function render() {
  app.lang = S.lang; app.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  const body = S.screen === 'start' ? start() : S.screen === 'play' ? play() : S.screen === 'fin' ? fin() : results();
  app.innerHTML = `<div class="wrap">${bar()}${S.screen === 'start' ? '' : progress()}${body}</div>`;
}

function resetRun() { Object.assign(S, { i: 0, picked: null, score: 0, miss: [], fin: {} }); }
function pick(v) {
  const c = PACKS[S.pack].cards[S.i];
  if (S.picked !== null) return;
  S.picked = v;
  if (v === c.a) S.score++; else S.miss.push(c);
  render();
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'lang') S.lang = v;
  else if (a === 'pack') S.pack = +v;
  else if (a === 'start') { resetRun(); S.screen = 'play'; }
  else if (a === 'pick') { pick(v); return; }
  else if (a === 'next') { if (S.i === 4) S.screen = 'fin'; else { S.i++; S.picked = null; } }
  else if (a === 'fin') { const x = +b.dataset.i; S.fin[x] = v; if (v !== FIN[x].a) S.miss.push({ t: FIN[x].t, a: FIN[x].a }); }
  else if (a === 'results') S.screen = 'results';
  else if (a === 'again') { S.pack = (S.pack + 1) % PACKS.length; resetRun(); S.screen = 'start'; }
  else if (a === 'redo') { resetRun(); S.screen = 'play'; }
  render();
  if (a === 'start' || a === 'next' || a === 'again' || a === 'results') window.scrollTo({ top: 0 });
});
document.addEventListener('keydown', e => {
  if (S.screen !== 'play') return;
  const k = e.key.toUpperCase();
  if (['M', 'L', 'B'].includes(k)) pick(k);
  else if ((e.key === 'Enter' || e.key === ' ') && S.picked !== null && document.activeElement === document.body) { e.preventDefault(); app.querySelector('[data-act="next"]')?.click(); }
});
render();
</script>

</body></html>
